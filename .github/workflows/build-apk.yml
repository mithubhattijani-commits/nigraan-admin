name: Build Nigraan Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Release signing: the keystore is stored ENCRYPTED in the repo
      # (android/app/nigraan-admin-release.keystore.enc) and decrypted here
      # with the KEYSTORE_PASSPHRASE repo secret. Every release build is
      # signed with the SAME permanent key, so the installed app updates
      # in place without uninstalling.
      - name: Decrypt release keystore
        run: openssl enc -d -aes-256-cbc -salt -pbkdf2 -in android/app/nigraan-admin-release.keystore.enc -out android/app/release.keystore -pass pass:"${{ secrets.KEYSTORE_PASSPHRASE }}"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
          KEY_ALIAS: nigraanadmin
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: flutter build apk --release

      - name: Verify APK
        run: |
          ls -la build/app/outputs/flutter-apk/app-release.apk
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | head -1)
          "$AAPT2" dump badging "$APK" | grep -F "package: name='com.nigraantv.admin'"
          EXPECTED_VC=$(grep -E '^version:' pubspec.yaml | sed 's/.*+//')
          EXPECTED_VN=$(grep -E '^version:' pubspec.yaml | sed 's/^version: //; s/+.*//')
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='$EXPECTED_VC'"
          "$AAPT2" dump badging "$APK" | grep -F "versionName='$EXPECTED_VN'"
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nigraan-admin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
